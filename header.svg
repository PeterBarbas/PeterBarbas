<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Peter Barmpas — Technical Program Manager, Engineer, Founder. Amsterdam to London.">
  <title>Peter Barmpas — Technical Program Manager · Engineer · Founder</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#121a34"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c6ec"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8fa8ff" opacity="0.13"/>
    </pattern>

    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="338" rx="22"/>
    </clipPath>

    <clipPath id="wipe">
      <rect x="60" y="150" width="0" height="60">
        <animate attributeName="width" from="0" to="760" dur="1.5s" begin="0.45s"
                 calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      </rect>
    </clipPath>

    <style><![CDATA[
      .f { font-family: "Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
      .rise { animation: rise 0.9s cubic-bezier(.16,1,.3,1) both; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .55s } .d3 { animation-delay: .95s }
      @keyframes rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: none } }
      .node { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .5s } .n3 { animation-delay: 1s } .n4 { animation-delay: 1.5s } .n5 { animation-delay: 2s }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.22); opacity:1 } }
      .drift { animation: drift 22s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 26s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(70px,-34px) } }
      @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-60px,40px) } }
      @media (prefers-reduced-motion: reduce) {
        .rise,.node,.drift,.drift2 { animation: none; opacity: 1; transform: none }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="338" fill="url(#grid)"/>

    <circle class="drift" cx="240" cy="60" r="230" fill="url(#orbA)"/>
    <circle class="drift2" cx="1010" cy="290" r="250" fill="url(#orbB)"/>

    <!-- dependency graph: sources converge on Tracer -->
    <g opacity="0.95">
      <g stroke="#7c5cff" stroke-opacity="0.32" stroke-width="1.4" fill="none">
        <path d="M 858 108 L 962 68"/>
        <path d="M 962 68 L 1054 118"/>
        <path d="M 858 108 L 902 198"/>
        <path d="M 902 198 L 1012 214"/>
        <path d="M 1054 118 L 1012 214"/>
      </g>

      <g fill="#22d3ee">
        <circle r="3.2"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 858 108 L 962 68"/></circle>
        <circle r="3.2"><animateMotion dur="3.2s" begin="0.7s" repeatCount="indefinite" path="M 962 68 L 1054 118"/></circle>
        <circle r="3.2" fill="#f472b6"><animateMotion dur="3.6s" begin="0.3s" repeatCount="indefinite" path="M 858 108 L 902 198"/></circle>
        <circle r="3.2" fill="#f472b6"><animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite" path="M 902 198 L 1012 214"/></circle>
        <circle r="3.2"><animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite" path="M 1054 118 L 1012 214"/></circle>
      </g>

      <g fill="#0a0f1f" stroke="#8fa8ff" stroke-width="1.6">
        <circle class="node" cx="858" cy="108" r="6"/>
        <circle class="node n2" cx="962" cy="68" r="5"/>
        <circle class="node n3" cx="1054" cy="118" r="6"/>
        <circle class="node n4" cx="902" cy="198" r="6"/>
      </g>

      <circle cx="1012" cy="214" r="11" fill="#0a0f1f" stroke="url(#accent)" stroke-width="2.2"/>
      <circle cx="1012" cy="214" r="11" fill="none" stroke="#7c5cff" stroke-width="1.4">
        <animate attributeName="r" values="11;30" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>

      <g class="f" font-size="10" letter-spacing="1.6" fill="#7f93bd">
        <text x="836" y="100" text-anchor="end">JIRA</text>
        <text x="880" y="203" text-anchor="end">SLACK</text>
        <text x="1070" y="112">GITHUB</text>
      </g>
      <text class="f" x="1012" y="248" text-anchor="middle" font-size="11.5" font-weight="700"
            letter-spacing="2.4" fill="#c9b6ff">TRACER</text>
    </g>

    <!-- identity block -->
    <g class="f">
      <text class="rise d1" x="62" y="128" font-size="58" font-weight="700" letter-spacing="-1.6"
            fill="url(#nameFill)">Peter Barmpas</text>

      <g clip-path="url(#wipe)">
        <text x="64" y="188" font-size="21.5" font-weight="500" fill="#93a7d0">
          Technical Program Manager · Engineer · Founder
        </text>
      </g>

      <g class="rise d3">
        <circle cx="70" cy="222" r="4.2" fill="#34d399"/>
        <circle cx="70" cy="222" r="4.2" fill="none" stroke="#34d399" stroke-width="1.2">
          <animate attributeName="r" values="4.2;13" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="88" y="227" font-size="15" fill="#6f83ac">
          Amsterdam → London · open to Senior TPM / EPM roles
        </text>
      </g>
    </g>

    <line x1="62" y1="296" x2="1138" y2="296" stroke="url(#accent)" stroke-width="2.2"
          stroke-linecap="round" stroke-dasharray="6 14" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="6s" repeatCount="indefinite"/>
    </line>

    <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#8fa8ff" stroke-opacity="0.14"/>
  </g>
</svg>
